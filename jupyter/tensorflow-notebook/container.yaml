docker: jupyter/tensorflow-notebook
url: https://hub.docker.com/r/jupyter/tensorflow-notebook
maintainer: '@vsoch'
description: Jupyter Tensorflow Notebook from 
  https://github.com/jupyter/docker-stacks
latest:
  x86_64-ubuntu-22.04: 'crane digest jupyter/tensorflow-notebook:x86_64-ubuntu-22.04:
    TOOMANYREQUESTS: You have reached your unauthenticated pull rate limit. Sign in
    for a higher limit: https://www.docker.com/increase-rate-limit'
tags:
  latest: 'crane digest jupyter/tensorflow-notebook:latest: TOOMANYREQUESTS: You have
    reached your unauthenticated pull rate limit. Sign in for a higher limit: https://www.docker.com/increase-rate-limit'
  ubuntu-20.04: 'crane digest jupyter/tensorflow-notebook:ubuntu-20.04: TOOMANYREQUESTS:
    You have reached your unauthenticated pull rate limit. Sign in for a higher limit:
    https://www.docker.com/increase-rate-limit'
  ubuntu-22.04: 'crane digest jupyter/tensorflow-notebook:ubuntu-22.04: TOOMANYREQUESTS:
    You have reached your unauthenticated pull rate limit. Sign in for a higher limit:
    https://www.docker.com/increase-rate-limit'
  x86_64-ubuntu-22.04: 'crane digest jupyter/tensorflow-notebook:x86_64-ubuntu-22.04:
    TOOMANYREQUESTS: You have reached your unauthenticated pull rate limit. Sign in
    for a higher limit: https://www.docker.com/increase-rate-limit'
  aarch64-ubuntu-22.04: 'crane digest jupyter/tensorflow-notebook:aarch64-ubuntu-22.04:
    TOOMANYREQUESTS: You have reached your unauthenticated pull rate limit. Sign in
    for a higher limit: https://www.docker.com/increase-rate-limit'
filter:
- ubuntu*
aliases:
- name: run-notebook
  command: jupyter notebook --no-browser --port=$(shuf -i 2000-65000 -n 1) --ip 
    0.0.0.0
